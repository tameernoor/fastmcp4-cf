name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile server.py
        run: python -m py_compile server.py
      - name: Shellcheck probe.sh
        run: shellcheck probe.sh redeploy.sh

      # The server must not come up unauthenticated by accident. Booting with
      # neither ACCESS_* nor ALLOW_OPEN_MODE has to fail, or the whole gate is
      # decoration.
      - name: Refuses to boot unauthenticated without ALLOW_OPEN_MODE
        run: |
          pip install --pre -r requirements.txt
          if REQUEST_STATE_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')" \
             PORT=9099 timeout 20 python server.py > /tmp/boot.log 2>&1; then
            echo "server booted with no auth and no ALLOW_OPEN_MODE"; cat /tmp/boot.log; exit 1
          fi
          grep -q "ALLOW_OPEN_MODE" /tmp/boot.log || { echo "wrong failure:"; cat /tmp/boot.log; exit 1; }
          echo "ok: refused to boot, and said why"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # `wrangler deploy --dry-run` in the build job bundles but does not
      # type-check, so without this the Worker is never checked at all.
      - name: Typecheck the Worker
        run: npm run typecheck

  # Versions are pinned exactly in both ecosystems, which stops surprises but
  # also means nothing picks up a security fix on its own. These are how we
  # hear about one.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=moderate
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # Type-checks the Worker, validates the container/DO/migration wiring,
      # and builds the image — without needing a Cloudflare account.
      - name: wrangler deploy --dry-run
        run: npx wrangler deploy --dry-run

  # The one that matters: boots the real container behind the real Worker and
  # drives a full multi-round-trip. Round 2 is routed by getRandom, so it will
  # usually land on a different instance than round 1 — which is exactly what
  # a per-process sealing key would break.
  round-trip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci

      # ALLOW_OPEN_MODE is required: with no ACCESS_* configured the server
      # refuses to boot rather than come up unauthenticated by accident. CI is
      # exactly the case that wants it on purpose.
      - name: Generate a request-state key
        run: |
          python -c "import secrets; print(f'REQUEST_STATE_KEY=\"{secrets.token_hex(32)}\"')" > .dev.vars
          echo 'ALLOW_OPEN_MODE="1"' >> .dev.vars

      - name: Start wrangler dev
        run: |
          npx wrangler dev --port 8787 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 90); do
            grep -q "Ready on" /tmp/wrangler.log && exit 0
            sleep 2
          done
          echo "wrangler dev did not become ready"; cat /tmp/wrangler.log; exit 1

      - name: server/discover advertises 2026-07-28
        run: |
          ./probe.sh http://localhost:8787 server/discover \
            | tee /dev/stderr \
            | python -c "
          import json,sys
          r = json.load(sys.stdin)['result']
          assert '2026-07-28' in r['supportedVersions'], r['supportedVersions']
          assert r['resultType'] == 'complete', r['resultType']
          print('ok: supportedVersions', r['supportedVersions'])"

      - name: tools/call with no handshake
        run: |
          ./probe.sh http://localhost:8787 tools/call whoami \
            | python -c "
          import json,sys
          r = json.load(sys.stdin)['result']
          assert r['resultType'] == 'complete', r
          print('ok:', r['content'][0]['text'][:60].replace(chr(10),' '))"

      - name: MRTR round-trip survives cross-instance routing
        run: |
          set -euo pipefail
          for i in $(seq 1 6); do
            STATE=$(./probe.sh http://localhost:8787 tools/call delete_notes '{"folder":"ci"}' \
              | python -c "
          import json,sys
          r = json.load(sys.stdin)['result']
          assert r['resultType'] == 'input_required', r
          print(r['requestState'])")
            ./probe.sh http://localhost:8787 tools/call delete_notes '{"folder":"ci"}' \
              '{"confirm":{"action":"accept","content":{"value":true}}}' "$STATE" \
              | python -c "
          import json,sys
          d = json.load(sys.stdin)
          assert 'error' not in d, d['error']
          assert d['result']['resultType'] == 'complete', d
          print('  round-trip $i ok')"
          done

      # Regression test for the dual-era routing bug. A 2025-era client used to
      # get a session held in ONE container's memory; fanning its later requests
      # across the pool returned `-32600 Session not found` for most of them, and
      # the client reported the server as having no tools. `stateless_http=True`
      # removes the session altogether, which is what lets legacy traffic be
      # load-balanced at all — so assert both halves of that: no session is
      # minted, and repeated sessionless requests keep working anyway.
      - name: Legacy traffic is served without a session
        run: |
          set -euo pipefail
          URL=http://localhost:8787/mcp
          curl -sS -D /tmp/legacy-headers.txt -o /dev/null -X POST $URL \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2025-11-25' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}'
          if grep -qi "mcp-session-id" /tmp/legacy-headers.txt; then
            echo "a session WAS minted — stateless_http is off, and legacy"
            echo "clients will break intermittently behind the load balancer"
            exit 1
          fi
          echo "ok: legacy initialize minted no session"
          for i in $(seq 1 8); do
            curl -sS -X POST $URL \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -H 'MCP-Protocol-Version: 2025-11-25' \
              -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
              | python -c "
          import sys, json
          raw = sys.stdin.read()
          lines = [l for l in raw.splitlines() if l.startswith('data: ')]
          d = json.loads(lines[0][6:]) if lines else json.loads(raw)
          assert 'error' not in d, 'legacy request failed: ' + d['error']['message']
          assert d['result']['tools'], 'no tools returned'
          print('  legacy tools/list $i ok —', [t['name'] for t in d['result']['tools']])"
          done

      # The MCP Apps extension is negotiated, so the wire metadata is the
      # contract: a UI-bound tool must carry _meta.ui.resourceUri, and the
      # resource it names must exist with the app profile MIME type.
      - name: monitor advertises its ui:// resource
        run: |
          set -euo pipefail
          ./probe.sh http://localhost:8787 tools/list \
            | python -c "
          import json, sys
          tools = {t['name']: t for t in json.load(sys.stdin)['result']['tools']}
          ui = tools['monitor']['_meta']['ui']
          assert ui['resourceUri'] == 'ui://fastmcp4-cf/monitor.html', ui
          print('ok: monitor ->', ui['resourceUri'])"
          ./probe.sh http://localhost:8787 resources/list \
            | python -c "
          import json, sys
          res = {r['uri']: r for r in json.load(sys.stdin)['result']['resources']}
          app = res['ui://fastmcp4-cf/monitor.html']
          assert app['mimeType'] == 'text/html;profile=mcp-app', app['mimeType']
          domains = app['_meta']['ui']['csp']['resourceDomains']
          assert 'https://unpkg.com' in domains, domains
          print('ok: resource', app['mimeType'], domains)"

      - name: monitor degrades to text for non-Apps clients
        run: |
          set -euo pipefail
          ./probe.sh http://localhost:8787 tools/call monitor \
            | python -c "
          import json, sys
          r = json.load(sys.stdin)['result']
          assert r['resultType'] == 'complete', r
          body = json.loads(r['content'][0]['text'])
          assert body['instance'] and body['calls_served'] >= 1, body
          print('ok: readable without the extension —', body['instance'])"

      # The limits exist because both of these returned 200 before: a 1 MB body
      # and a 500-level nested object were accepted and parsed.
      - name: Oversized and deeply nested bodies are rejected
        run: |
          set -euo pipefail
          python -c "
          import json
          print(json.dumps({'jsonrpc':'2.0','id':1,'method':'tools/call','params':{
            'name':'whoami','arguments':{'pad':'A'*400000},
            '_meta':{'io.modelcontextprotocol/protocolVersion':'2026-07-28',
                     'io.modelcontextprotocol/clientInfo':{'name':'ci','version':'1'},
                     'io.modelcontextprotocol/clientCapabilities':{}}}}))" > /tmp/big.json
          python -c "
          import json
          o={'a':1}
          for _ in range(500): o={'a':o}
          print(json.dumps({'jsonrpc':'2.0','id':1,'method':'tools/call','params':{
            'name':'whoami','arguments':{'deep':o},
            '_meta':{'io.modelcontextprotocol/protocolVersion':'2026-07-28',
                     'io.modelcontextprotocol/clientInfo':{'name':'ci','version':'1'},
                     'io.modelcontextprotocol/clientCapabilities':{}}}}))" > /tmp/deep.json
          for f in big:413 deep:400; do
            file="/tmp/${f%%:*}.json"; want="${f##*:}"
            got=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://localhost:8787/mcp \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -H 'MCP-Protocol-Version: 2026-07-28' \
              -H 'Mcp-Method: tools/call' -H 'Mcp-Name: whoami' -d @"$file")
            [ "$got" = "$want" ] || { echo "$file: expected $want, got $got"; exit 1; }
            echo "ok: $file -> $got"
          done

      # The header is a routing and integrity signal, so a mismatch must not be
      # silently ignored. Both name-bearing methods are checked.
      - name: Mcp-Name mismatch is rejected
        run: |
          set -euo pipefail
          meta='"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"ci","version":"1"},"io.modelcontextprotocol/clientCapabilities":{}}'
          curl -sS -X POST http://localhost:8787/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: tools/call' -H 'Mcp-Name: monitor' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"whoami\",\"arguments\":{},$meta}}" \
            | python -c "
          import json, sys
          d = json.load(sys.stdin)
          assert 'error' in d, 'mismatched Mcp-Name was ACCEPTED: ' + json.dumps(d)
          assert d['error']['code'] == -32020, d['error']
          print('ok: rejected —', d['error']['message'])"

      - name: Tampered request_state is rejected
        run: |
          set -euo pipefail
          STATE=$(./probe.sh http://localhost:8787 tools/call delete_notes '{"folder":"ci"}' \
            | python -c "import json,sys; print(json.load(sys.stdin)['result']['requestState'])")
          BAD=$(printf '%s' "$STATE" | sed 's/^v1\..\{6\}/v1.AAAAAA/')
          ./probe.sh http://localhost:8787 tools/call delete_notes '{"folder":"ci"}' \
            '{"confirm":{"action":"accept","content":{"value":true}}}' "$BAD" \
            | python -c "
          import json,sys
          d = json.load(sys.stdin)
          assert 'error' in d, 'tampered state was ACCEPTED: ' + json.dumps(d)
          print('ok: rejected —', d['error']['message'])"

      - name: Wrangler log on failure
        if: failure()
        run: cat /tmp/wrangler.log
